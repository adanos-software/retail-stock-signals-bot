name: Daily Reddit Post Publish

"on":
  workflow_dispatch: {}
  schedule:
    # 17:55 Europe/Berlin => 15:55 UTC during CEST.
    - cron: "55 15 * * *"
    # 17:55 Europe/Berlin => 16:55 UTC during CET.
    - cron: "55 16 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Berlin schedule slot
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 <<'PY' | tee -a "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ["EVENT_NAME"]
          event_schedule = os.environ.get("EVENT_SCHEDULE", "")
          now = datetime.now(ZoneInfo("Europe/Berlin"))
          offset_hours = int(now.utcoffset().total_seconds() // 3600)
          expected_schedule = "55 15 * * *" if offset_hours == 2 else "55 16 * * *"
          should_run = event_name == "workflow_dispatch" or event_schedule == expected_schedule
          reason = (
              "manual dispatch"
              if event_name == "workflow_dispatch"
              else f"event_schedule={event_schedule}; expected_schedule={expected_schedule}; berlin_offset=UTC+{offset_hours}"
          )

          print(f"should_run={str(should_run).lower()}")
          print(f"reason={reason}")
          PY

      - name: Skip duplicate DST slot
        if: steps.schedule.outputs.should_run != 'true'
        run: |
          echo "Skipping run: ${{ steps.schedule.outputs.reason }}"

      - name: Set up Python
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        if: steps.schedule.outputs.should_run == 'true'
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        if: steps.schedule.outputs.should_run == 'true'
        run: python -m pytest

      - name: Generate Markdown draft
        if: steps.schedule.outputs.should_run == 'true'
        env:
          ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p out
          DATE_SLUG="$(TZ=Europe/Berlin date +%F)"
          retail-stock-signals --output "out/daily-retail-stock-signals.md"
          mkdir -p public
          cp out/daily-retail-stock-signals.md "public/daily-retail-stock-signals-${DATE_SLUG}.md"
          cp out/daily-retail-stock-signals.md "public/daily-retail-stock-signals-latest.md"
          sed -n '1,220p' "public/daily-retail-stock-signals-${DATE_SLUG}.md"

      - name: Commit public draft
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          DATE_SLUG="$(TZ=Europe/Berlin date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add "public/daily-retail-stock-signals-${DATE_SLUG}.md" "public/daily-retail-stock-signals-latest.md"
          if git diff --cached --quiet; then
            echo "No draft changes to commit."
          else
            git commit -m "Publish daily Reddit draft ${DATE_SLUG}"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              git pull --rebase --autostash origin main
            done
          fi

      - name: Upload draft artifact
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: daily-retail-stock-signals
          path: public/daily-retail-stock-signals-latest.md
