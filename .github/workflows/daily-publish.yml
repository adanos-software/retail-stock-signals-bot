name: Daily Reddit Post Publish

"on":
  workflow_dispatch:
    inputs:
      scheduler:
        description: "External scheduler source"
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Generate Markdown draft
        env:
          ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p out
          DATE_SLUG="$(TZ=Europe/Berlin date +%F)"
          retail-stock-signals --output "out/daily-retail-stock-signals.md"
          mkdir -p public
          cp out/daily-retail-stock-signals.md "public/daily-retail-stock-signals-${DATE_SLUG}.md"
          cp out/daily-retail-stock-signals.md "public/daily-retail-stock-signals-latest.md"
          sed -n '1,220p' "public/daily-retail-stock-signals-${DATE_SLUG}.md"

      - name: Commit public draft
        run: |
          DATE_SLUG="$(TZ=Europe/Berlin date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add "public/daily-retail-stock-signals-${DATE_SLUG}.md" "public/daily-retail-stock-signals-latest.md"
          if git diff --cached --quiet; then
            echo "No draft changes to commit."
          else
            git commit -m "Publish daily Reddit draft ${DATE_SLUG}"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              git pull --rebase --autostash origin main
            done
          fi

      - name: Upload draft artifact
        uses: actions/upload-artifact@v6
        with:
          name: daily-retail-stock-signals
          path: public/daily-retail-stock-signals-latest.md
